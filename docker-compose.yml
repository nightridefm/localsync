# Local Postgres + Electric baseline for the capability harness and the
# simulation. Host ports are overridable so this can run next to an app's
# own dev stack:
#   LOCALSYNC_PG_PORT (default 5532), LOCALSYNC_ELECTRIC_PORT (default 3130).
# Smoke check: scripts/check-compose.sh

name: localsync

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: localsync
    command:
      - postgres
      - -c
      - wal_level=logical
      # Bounded WAL retention for abandoned / lagging slots (the engine's
      # slot and Electric's). A slot past this is invalidated rather than
      # filling the disk; the engine must detect that and re-snapshot.
      - -c
      - max_slot_wal_keep_size=4GB
      - -c
      - max_replication_slots=32
      - -c
      - max_wal_senders=32
      # The parallel simulation runs one engine + harness pool per job
      # (about 15 connections each).
      - -c
      - max_connections=300
    ports:
      - '${LOCALSYNC_PG_PORT:-5532}:5432'
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker, so the
      # volume mounts the parent (the image's documented layout for 18+).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d localsync']
      interval: 2s
      timeout: 3s
      retries: 30

  electric:
    # Pinned to the version the apps run in production; the baseline matrix
    # is only meaningful against that exact version.
    image: electricsql/electric:1.7.9
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/localsync
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-localsync-dev-secret}
      # Same flags as production: subquery shapes + tagged move-in/move-out.
      ELECTRIC_FEATURE_FLAGS: allow_subqueries,tagged_subqueries
    ports:
      - '${LOCALSYNC_ELECTRIC_PORT:-3130}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/v1/health']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    # TLS gateway (nginx, like the apps') for wss:// and https:// tests;
    # only with `--profile gateway`. Needs a certificate for a name that
    # resolves to 127.0.0.1, from an existing Let's Encrypt volume, set in
    # .env (gitignored): LOCALSYNC_TLS_VOLUME, LOCALSYNC_TLS_DOMAIN.
    # Host networking: it reaches the engines the harness and the browser
    # tests start on 127.0.0.1, and serves 8443 and 8444 (TCP and QUIC).
    profiles: [gateway]
    image: nginx:1.29-alpine
    network_mode: host
    environment:
      LOCALSYNC_TLS_DOMAIN: ${LOCALSYNC_TLS_DOMAIN:-localhost}
    # Only our template renders into conf.d: the image's default server
    # would otherwise listen on host port 80 (an app's nginx needs it).
    tmpfs:
      - /etc/nginx/conf.d
    volumes:
      - ./docker/gateway/templates:/etc/nginx/templates:ro
      - ./docker/gateway/snippets:/etc/nginx/snippets:ro
      - tls:/etc/letsencrypt:ro

volumes:
  pgdata:
  tls:
    external: true
    name: ${LOCALSYNC_TLS_VOLUME:-localsync_tls}
