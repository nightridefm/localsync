# The engine behind a gateway. Nothing here is tuned for localsync beyond
# the WebSocket upgrade every app gateway already has: timeouts and
# buffering are nginx's defaults (60s, buffering on), the worst case of the
# routes an app would mount the engine on. The engine sends a beat every
# 15s and `X-Accel-Buffering: no` on /sync/http, which is what keeps both
# working here.

location = /sync {
    proxy_pass http://$engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location = /sync/http {
    proxy_pass http://$engine;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}

# A hostile middlebox, as on some corporate networks: it refuses the
# WebSocket upgrade and holds every response until it is complete. It is a
# small proxy the tests run (ts/harness/src/middlebox.ts on 8079; nginx's
# own buffering still forwards data as it arrives). The client must fall
# back to HTTP and detect the buffering (long polls).
location /hostile/ {
    proxy_pass http://127.0.0.1:8079/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Engine $engine;
}
